[package]
name = "aws-s3-manager"
version = "0.1.4"
edition = "2024"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
aws-config = {version = "1.13.2", features = ["rustls"]}
aws-sdk-s3 = {version = "1.159.0", features = ["rustls"]}
base64 = "0.23.1"
hmac = "0.13.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
chrono = "0.4.45"
hex = "0.4.3"

[dev-dependencies]
image = "0.25.10"
dotenv = "0.15.0"
tokio = { version = "1.47.1", features = ["full"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "multipart", "rustls"] }
